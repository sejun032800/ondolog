<!doctype html>
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 판권 · 정오</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<!-- v2.0.0 · 판권 · 정오(colophon) 1면 — 발행 정보 + 정정 창구. 계약 contracts/colophon.json(+ F-CO)
     호 번호 · 발행일은 찍지 않는다(표지 규칙 R21 · 16-2 r63과 같음) — "2026년 9월호"까지만.
     **정오**: 지난 호에 실린 것을 바로잡은 내용(errata[] · 있을 때만) + 정정 창구(설정 › 문의). 정정이 없으면 창구 안내만. 다음 호를 약속하는 문장 0(R157-7) — 창구 문장에도 "다음 호에"를 쓰지 않는다.
     쪽 수 맞춤의 마지막 수단("판권 여백")이 이 면이다 — 아래 여백은 비워 둔다(빈 쪽을 만들지 않으려 판권을 늘리지 않는다) -->
<body class="co">
  <div class="ab col run">
    <span class="kk-ko">판권과 정오</span>
    <span class="kk-ko" data-slot="@colophon.issueLabel">2026년 9월호</span>
  </div>

  <div class="ab col" style="top:92px"><span class="kk">Colophon</span><div class="hair" style="width:120px;margin-top:12px"></div></div>
  <div class="ab" style="left:var(--mX);width:var(--bodyW);top:190px">
    <span class="wm" style="font-size:20px">ONDOLOG</span>
    <div class="crs">
      <div class="cr" data-optional><span class="ck">호</span><span class="cv" data-slot="@colophon.issueLabel">2026년 9월호</span></div>
      <div class="cr" data-optional><span class="ck">만든 이</span><span class="cv" data-slot="@colophon.names">늘봄 · 세준 · 서영</span></div>
      <div class="cr" data-optional><span class="ck">글</span><span class="cv" data-slot="@colophon.writers">두 사람 · 온도록(AI가 쓴 문장은 발행 노트에 따로 셈)</span></div>
      <div class="cr" data-optional><span class="ck">사진</span><span class="cv" data-slot="@colophon.photographers">두 사람</span></div>
      <div class="cr" data-optional><span class="ck">만든 곳</span><span class="cv" data-slot="@colophon.maker">온도록</span></div>
      <div class="cr" data-optional><span class="ck">조판</span><span class="cv" data-slot="@colophon.typeset">온도록 렌더러 · 틀 v2.0.0</span></div>
      <div class="cr" data-optional><span class="ck">서체</span><span class="cv" data-slot="@colophon.fonts">Pretendard · 마루부리</span></div>
      <div class="cr" data-optional><span class="ck">테마</span><span class="cv" data-slot="@colophon.themeLabel">basic</span></div>
      <div class="cr" data-optional><span class="ck">계산 기준</span><span class="cv" data-slot="@colophon.versions">dna_v0 · norm-synthetic-v3</span></div>
    </div>
  </div>
  <div class="ab" style="left:var(--mX);width:var(--bodyW);bottom:120px">
    <div class="er" data-optional>
      <span class="lbl sec">정오 — 지난 호에서 바로잡습니다</span>
      <div data-repeat="payload.errata"><p class="el"><span class="ep" data-slot=".where">8월호 14쪽</span><span data-slot=".text">"연남동 카페 오월"은 "연남동 카페 오월길"이 맞습니다.</span></p></div>
    </div>
    <div class="rule" style="margin:18px 0 14px"></div>
    <p class="body-sub" style="margin:0" data-slot="payload.correction">잘못 실린 문장이나 사진이 있으면 앱의 설정 › 문의로 알려 주십시오.</p>
  </div>
  <style>
    .co .crs{margin-top:26px;border-top:1.2px solid var(--ink)}
    .co .cr{display:flex;gap:24px;padding:11px 0;border-bottom:.6px solid var(--rule)}
    .co .ck{flex:0 0 84px;font-size:10.1px;letter-spacing:.06em;color:var(--sub);padding-top:1px}
    .co .cv{flex:1 1 auto;font-size:12px;line-height:1.55}
    .co .sec{display:block;font-weight:700;margin-bottom:10px}
    .co .el{margin:0 0 8px;font-size:12px;line-height:1.6;padding-left:96px;text-indent:-96px}
    .co .ep{display:inline-block;width:96px;text-indent:0;font-size:10.1px;color:var(--sub)}
  </style>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">3 1</div>
</body>
</html>
