<!doctype html>
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 데이트 아카이브 ③ 장소와 물음</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="da-places">
  <div class="ab col run">
    <span class="kk-ko">데이트 아카이브</span>
    <span class="kk-ko">이동 경로 · 세 가지 물음</span>
  </div>
  <div class="ab col" style="top:60px;display:flex;justify-content:space-between;align-items:baseline">
    <span class="kk">Route of the Month</span>
    <span class="lbl" data-slot="@da.routeSummary">2개 지역 · 5개 장소</span>
  </div>
  <div class="ab col" style="top:92px">
    <h2 class="h-lead clamp1" data-slot="@da.routeHeadline">8월에 두 사람이 그린 지도</h2>
  </div>

  <!-- 장소 목록 — 지도 지면(mapInfographic)은 MVP에 없다. 번호는 CSS 카운터 -->
  <div class="ab col pl-list" style="top:168px" data-repeat="@da.places">
    <div style="display:flex;align-items:baseline;gap:20px;padding:15px 0;
         border-bottom:.6px solid var(--rule)">
      <span class="pl-no"></span>
      <span style="width:74px;flex:none;font-size:10.1px;color:var(--sub);
            font-feature-settings:'tnum' 1" data-slot=".date">08.19</span>
      <span style="flex:1;font-size:13px" data-optional><span data-slot=".placeName">홍대 CGV</span></span>
    </div>
  </div>

  <div class="ab col" style="top:640px">
    <div class="hair"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:18px">
      <span class="kk">Three Questions</span>
      <span class="note">답을 적는 칸이 아닙니다. 온도록은 이 질문의 답을 저장하지 않습니다.</span>
    </div>
  </div>

  <!-- 세 물음 — 3열. 답 입력 UI를 넣지 않는다(MASTER 절대 규칙 · §2-2) -->
  <div class="ab col q-list" style="top:706px;display:flex;gap:34px"
       data-repeat="payload.articles[featured].closingQuestions">
    <div style="flex:1">
      <span class="q-no"></span>
      <p class="mb clamp3" style="margin:16px 0 0;font-size:14px;line-height:24px"
         data-slot=".text">이날의 데이트는<br>10점 만점에 몇 점?</p>
      <span class="note" style="display:block;margin-top:18px"><span data-slot=".type">평가</span>
        <span data-optional> · <span data-slot=".basis">서로의 점수를 맞춰보는 질문</span></span></span>
    </div>
  </div>
  <div class="ab folio folio-r" style="right:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
