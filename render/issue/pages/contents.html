<!doctype html>
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 목차</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="contents">
  <div class="ab ph" style="right:0;top:0;width:234px;height:567px" data-optional>
    <img data-src="@contents.photo" src="../images/sample/contents.jpg" alt="">
  </div>

  <div class="ab" style="left:var(--mX);top:62px">
    <span class="kk">Contents</span>
    <div class="hair" style="width:120px;margin-top:12px"></div>
  </div>

  <div class="ab" style="left:var(--mX);top:230px;width:366px" data-repeat="@toc">
    <div style="display:flex;align-items:flex-start;gap:0;padding:13px 0 16px;
         border-bottom:.6px solid var(--rule)">
      <span style="width:9px;height:9px;background:var(--acc);margin:9px 21px 0 0;flex:none"></span>
      <span style="flex:1">
        <span class="h-sec" style="display:block" data-slot=".title">데이트 아카이브</span>
        <span class="note" style="display:block;margin-top:7px" data-slot=".desc">화보 · 8월의 두 번의 하루 · 기사 2편</span>
      </span>
      <span style="font-size:12px;font-feature-settings:'tnum' 1;color:var(--sub);margin-top:3px"
            data-slot=".page">04</span>
    </div>
  </div>

  <div class="ab col" style="top:900px">
    <p class="body-sub" style="margin:0;width:var(--bodyW)">코너마다 잉크 색이 다릅니다. 지표를 다루는 코너는 세이지, 이야기를 다루는 코너는 먹, 두 사람이 실제로 주고받은 말을 그대로 싣는 코너는 가장 옅은 담묵을 씁니다. 색이 옅어질수록 온도록이 문장에 손을 덜 댔다는 뜻입니다.</p>
  </div>
  <div class="ab col" style="bottom:72px">
    <div class="rule" style="margin-bottom:14px"></div>
    <p class="note" style="margin:0">수록된 사진과 문장은 두 사람이 남긴 기록이며, 편집 외의 각색은 하지 않았습니다.</p>
  </div>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
