<!doctype html>
<!-- 임시 — 디자인 v2.0.0 반입 때 교체 (위임 m20-a1 ⑧ · R156-3 "구현 먼저, 모양은 나중").
     계약 필드(docs/magazine-2-0/contracts/love_dna.json)만 싣는다. 모양은 base.css 글꼴 · 판면 재사용 - 새 디자인 요소 0.
     넘침 · 잘림 · 겹침은 지면 검사가 실패로 처리한다(R152-2 · 한 면 고정 · 높이 예측 표 없음). -->
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 두 사람의 결</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="tp tp-dna-score">
  <div class="ab col" style="top:60px;display:flex;align-items:center;gap:14px">
    <span class="kk-ko" data-slot="@tp.cornerName">두 사람의 결</span>
    <span style="flex:1;height:.6px;background:var(--hair)"></span>
    <span class="lbl" data-slot="@tp.periodLabel">2026년 9월</span>
  </div>
  <div class="ab col rule-heavy" style="top:84px"></div>
  <div class="ab col" style="top:112px;display:flex;flex-direction:column;gap:18px">
    <h1 class="mb" style="margin:0;font-size:34px;line-height:46px;font-weight:300" data-slot="@tp.pageTitle">두 사람의 결</h1>
    <div style="display:flex;align-items:baseline;gap:16px">
      <span class="mb" style="font-size:96px;line-height:100px;font-weight:300;color:var(--ink)" data-slot="@tp.total">65</span>
      <span class="lbl">일치율</span>
    </div>
    <span class="lbl" data-slot="@tp.baseLine">성격 기저 65</span>
    <span class="lbl" data-optional><span data-slot="@tp.chatMark">채팅 반영 전</span></span>
    <span class="lbl" data-slot="@tp.deltaLine">첫 호</span>
    <div data-repeat="@tp.partners"><span class="h-sec" style="display:block;margin-bottom:6px" data-slot=".line">가람 · 예시 라벨</span></div>
    <div class="rule"></div>
    <p class="body-sub" style="margin:0" data-slot="@tp.explain">설명 문장</p>
  </div>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
