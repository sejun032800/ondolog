<!doctype html>
<!-- 임시 — 디자인 v2.0.0 반입 때 교체 (위임 m20-a1 ⑧ · R156-3 "구현 먼저, 모양은 나중").
     계약 필드(docs/magazine-2-0/contracts/rough_guess.json)만 싣는다. 모양은 base.css 글꼴 · 판면 재사용 - 새 디자인 요소 0.
     넘침 · 잘림 · 겹침은 지면 검사가 실패로 처리한다(R152-2 · 한 면 고정 · 높이 예측 표 없음). -->
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 어림짐작</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="tp tp-rough-guess">
  <div class="ab col" style="top:60px;display:flex;align-items:center;gap:14px">
    <span class="kk-ko" data-slot="@tp.cornerName">어림짐작</span>
    <span style="flex:1;height:.6px;background:var(--hair)"></span>
    <span class="lbl" data-slot="@tp.periodLabel">2026년 9월</span>
  </div>
  <div class="ab col rule-heavy" style="top:84px"></div>
  <div class="ab col" style="top:112px;display:flex;flex-direction:column;gap:12px">
    <h1 class="mb" style="margin:0;font-size:30px;line-height:42px;font-weight:300" data-slot="@tp.pageTitle">어림짐작</h1>
    <span class="lbl" data-slot="@tp.disclaimer">재미로만 봐주세요. 진짜로 재는 건 아닙니다.</span>
    <div data-repeat="@tp.items">
      <div style="margin-bottom:12px">
        <span class="note" style="display:block"><span data-slot=".label">먼저 고백했을 확률</span> · <span data-slot=".sourceLabel">추정</span></span>
        <span class="h-sec" style="display:block" data-slot=".line">가람님이 먼저 고백했을 확률 73%</span>
      </div>
    </div>
    <div data-if="@tp.busiestDate">
      <span class="note" style="display:block">가장 말이 많았던 날 · 실측</span>
      <span class="h-sec" style="display:block" data-slot="@tp.busiestDate">9월 14일</span>
      <span class="body-sub" style="display:block" data-optional><span data-slot="@tp.busiestLine">그날은 이사 얘기가 오갔습니다</span></span>
    </div>
    <div class="rule"></div>
    <span class="note"><span data-slot="@tp.topicTitle">여행 계획을 세운다면</span> · 이달의 어림짐작 · 추정</span>
    <span class="h-sec" data-slot="@tp.topicLine">가람님이 숙소를 먼저 정할 확률 89%</span>
    <span class="note" data-slot="@tp.footnote">성격 검사와 이번 달 대화 기록으로 계산했습니다</span>
  </div>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
