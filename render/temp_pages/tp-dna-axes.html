<!doctype html>
<!-- 임시 — 디자인 v2.0.0 반입 때 교체 (위임 m20-a1 ⑧ · R156-3 "구현 먼저, 모양은 나중").
     계약 필드(docs/magazine-2-0/contracts/love_dna.json)만 싣는다. 모양은 base.css 글꼴 · 판면 재사용 - 새 디자인 요소 0.
     넘침 · 잘림 · 겹침은 지면 검사가 실패로 처리한다(R152-2 · 한 면 고정 · 높이 예측 표 없음). -->
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 두 사람의 결</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="tp tp-dna-axes">
  <div class="ab col" style="top:60px;display:flex;align-items:center;gap:14px">
    <span class="kk-ko" data-slot="@tp.cornerName">두 사람의 결</span>
    <span style="flex:1;height:.6px;background:var(--hair)"></span>
    <span class="lbl" data-slot="@tp.periodLabel">2026년 9월</span>
  </div>
  <div class="ab col rule-heavy" style="top:84px"></div>
  <div class="ab col" style="top:112px;display:flex;flex-direction:column;gap:10px">
    <span class="lbl sec">빅5 다섯 축</span>
    <div data-repeat="@tp.axes"><span class="note" style="display:block" data-slot=".line">개방성 60 · 55 · 가까움</span></div>
    <span class="lbl sec">스턴버그 세 성분</span>
    <div data-repeat="@tp.sternberg"><span class="note" style="display:block" data-slot=".line">친밀감 70 · 70 · 겹침 70</span></div>
    <span class="h-sec" data-slot="@tp.attachmentHeadline">애착 조합</span>
    <p class="body-sub" style="margin:0" data-slot="@tp.attachmentBody">해설</p>
    <span class="lbl sec">강점</span>
    <div data-repeat="@tp.strengths"><span class="note" style="display:block" data-slot=".">강점</span></div>
    <span class="lbl sec">보완 지점</span>
    <div data-repeat="@tp.complements"><span class="note" style="display:block" data-slot=".">보완</span></div>
    <div data-if="@tp.actionTips">
      <span class="lbl sec">해 볼 수 있는 것</span>
      <div data-repeat="@tp.actionTips"><span class="note" style="display:block" data-slot=".">팁</span></div>
    </div>
  </div>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
