<!doctype html>
<!-- 임시 — 디자인 v2.0.0 반입 때 교체 (위임 m20-a1 ⑧ · R156-3 "구현 먼저, 모양은 나중").
     계약 필드(docs/magazine-2-0/contracts/colophon.json)만 싣는다. 모양은 base.css 글꼴 · 판면 재사용 - 새 디자인 요소 0.
     넘침 · 잘림 · 겹침은 지면 검사가 실패로 처리한다(R152-2 · 한 면 고정 · 높이 예측 표 없음). -->
<html lang="ko" data-theme="basic">
<head>
  <meta charset="utf-8">
  <title>ONDOLOG — 판권 정오</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../themes/basic.css">
  <link rel="stylesheet" href="../themes/hip.css">
  <link rel="stylesheet" href="../themes/neon.css">
  <link rel="stylesheet" href="../themes/lovely.css">
  <link rel="stylesheet" href="../themes/night.css">
  <link rel="stylesheet" href="../themes/ondol.css">
</head>
<body class="tp tp-colophon">
  <div class="ab col" style="top:60px;display:flex;align-items:center;gap:14px">
    <span class="kk-ko" data-slot="@tp.cornerName">판권 정오</span>
    <span style="flex:1;height:.6px;background:var(--hair)"></span>
    <span class="lbl" data-slot="@tp.periodLabel">2026년 9월</span>
  </div>
  <div class="ab col rule-heavy" style="top:84px"></div>
  <div class="ab col" style="top:112px;display:flex;flex-direction:column;gap:18px">
    <h1 class="mb" style="margin:0;font-size:30px;line-height:42px;font-weight:300" data-slot="@tp.pageTitle">판권 정오</h1>
    <span class="h-sec" data-slot="@tp.editionLine">2026년 9월호</span>
    <span class="note" data-slot="@tp.periodLine">수집 기간 9월 1일 ~ 9월 30일</span>
    <span class="note" data-slot="@tp.namesLine">세준 · 서영</span>
    <span class="note" data-slot="@tp.makerLine">만든 곳 온도록</span>
    <div data-if="!@tp.split">
      <div class="rule" style="margin:12px 0"></div>
      <span class="lbl sec">정오</span>
      <p class="body-sub" style="margin:0" data-slot="@tp.correctionLine">바로잡을 내용은 설정 › 문의로 알려 주세요.</p>
    </div>
  </div>
  <div class="ab folio" style="left:var(--mX)" data-slot="@page">0 4</div>
</body>
</html>
