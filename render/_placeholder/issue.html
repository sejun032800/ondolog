<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>임시 지면</title>
<!-- 임시 지면 (55-1). 꾸미지 않는다 - 진짜 지면은 55-2(render/issue/). 슬롯 표시로 채움 모듈을 먼저 써 본다. -->
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #000; background: #fff; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; padding: 18mm; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }
  h1 { font-size: 20pt; margin: 0 0 4mm; }
  p { margin: 0 0 3mm; font-size: 10pt; }
  ul { list-style: none; margin: 8mm 0; padding: 0; }
  li { margin: 0 0 4mm; font-size: 10pt; }
  .label { font-weight: bold; }
  .photos img { width: 40mm; margin: 0 3mm 3mm 0; }
</style>
</head>
<body>
<section class="page">
  <p>임시 지면</p>
  <h1 data-slot="@issue.name"></h1>
  <p data-optional><span data-slot="@issue.couple"></span></p>
  <p data-slot="@issue.period"></p>

  <ul>
    <li data-repeat="@corners">
      <span class="label" data-slot="label"></span> -
      <span data-slot="statusLabel"></span>
      <div data-variant="view">
        <p data-case="ready"><span data-slot="title"></span> <span data-optional>(<span data-slot="periodLabel"></span>)</span></p>
        <p data-case="absent"><span data-optional>사유: <span data-slot="reason"></span></span></p>
      </div>
    </li>
  </ul>

  <p data-if="!@issue.hasPhotos">실린 사진 없음</p>
  <div class="photos" data-optional>
    <img data-repeat="@photos" data-src=".">
  </div>
</section>
</body>
</html>
