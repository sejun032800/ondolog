<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화면 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:url(/_blob/dc4276bddfe7e1f5b7ffe6b71066dbcc) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;src:url(/_blob/a07e84361b7478dfb56205ac89000d7c) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;src:url(/_blob/b02b332f1f355064afa890bbfbacb246) format('woff2')}
body{margin:0}
</style>
</helmet>
<div style="width: 1800px; min-height: 1600px; box-sizing: border-box; padding: 56px 64px; background: #0A0814; color: #F3EFF7; font-family: Pretendard, sans-serif; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.32em; color: #9C93B4">SCREEN INDEX</div>
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.02em">모든 기능이 완성된 온도록 — 109화면</div>
      <div style="font-size: 14px; color: #C9C1DA">근거는 MASTER 절 번호, UI_PLAN v3 절, ROADMAP r13 결정 번호. 화면의 존재와 순서는 MASTER, 외형은 이 캔버스가 정한다.</div>
    </div>
    <div style="display: flex; gap: 18px; font-size: 12.5px; color: #9C93B4">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #F4B9C8"></span>핵심 화면 — 단독 아트보드, 눌러서 이동</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #6E6688"></span>전체 화면 — 그룹 보드</span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; align-items: start">
    <sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 28px">
        <sc-for list="{{col.groups}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid rgba(243,239,247,0.16)">
              <span style="font-size: 17px; font-weight: 600">{{g.name}}</span>
              <span style="font-size: 12.5px; color: #9C93B4">{{g.count}}</span>
            </div>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="6">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 30px; border-bottom: 1px solid rgba(243,239,247,0.05)">
                <span style="{{r.dot}}"></span>
                <span style="width: 34px; font-size: 12.5px; font-weight: 600; color: #F3EFF7">{{r.id}}</span>
                <span style="flex: 1; font-size: 13px; color: #C9C1DA">{{r.name}}</span>
                <span style="font-size: 11.5px; color: #9C93B4; text-align: right">{{r.src}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":1600}}'>

    const A = G('A 온보딩 · 인증', [

      ['A07','연애유형 5문항','화면4 · 10-1'],['A08','간략 결과 — 공유용','화면5'],['A09','공유 카드 이미지','화면5'],

</script>
